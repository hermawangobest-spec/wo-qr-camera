<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wedding Organizer QR Scanner</title>
<style>body{font:16px Arial,sans-serif;max-width:760px;margin:20px auto;padding:0 14px;color:#172033}button{padding:10px 16px;border:0;border-radius:8px;background:#6d35e8;color:white;cursor:pointer;margin:4px}#reader{width:100%;max-width:620px;margin:14px auto}.muted{color:#667085}#status{padding:12px;border-radius:8px;background:#f2f4f7;margin:12px 0}</style>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script></head>
<body><h2>Scan QR Tamu</h2><p class="muted">Izinkan akses kamera jika diminta browser. Setelah QR terbaca, hasil akan dikirim ke aplikasi Wedding Organizer.</p><div id="status">Menyiapkan kamera…</div><div id="reader"></div><button onclick="stop()">Tutup Kamera</button>
<script>
let scanner=null,done=false;
function send(text){if(done)return;done=true;document.getElementById('status').textContent='QR terbaca. Mengirim ke Wedding Organizer…';try{if(window.opener&&!window.opener.closed){window.opener.postMessage({type:'WO_QR_SCAN',text:String(text)},'https://script.google.com');document.getElementById('status').textContent='QR dikirim. Anda bisa menutup jendela ini.';setTimeout(()=>window.close(),900);}else{document.getElementById('status').textContent='Aplikasi utama tidak ditemukan. Tutup scanner dan buka dari tombol Scan QR di aplikasi.';done=false;}}catch(e){document.getElementById('status').textContent='Gagal mengirim hasil: '+e.message;done=false;}}
async function start(){try{if(!window.isSecureContext)throw Error('Halaman ini harus dibuka melalui HTTPS.');if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw Error('Browser tidak menyediakan akses kamera.');const probe=await navigator.mediaDevices.getUserMedia({video:true,audio:false});probe.getTracks().forEach(t=>t.stop());scanner=new Html5Qrcode('reader');const cams=await Html5Qrcode.getCameras();if(!cams.length)throw Error('Kamera tidak ditemukan.');const cam=cams.find(c=>/back|rear|environment/i.test(c.label||''))||cams[0];await scanner.start(cam.id,{fps:10,qrbox:{width:250,height:250}},async text=>{try{await scanner.stop();}catch(e){}send(text);},()=>{});document.getElementById('status').textContent='Kamera aktif. Arahkan ke QR tamu.';}catch(e){document.getElementById('status').textContent='Gagal membuka kamera: '+(e.message||e)+' — pastikan halaman HTTPS dan izin kamera diizinkan.';}}
async function stop(){try{if(scanner&&scanner.isScanning)await scanner.stop();}catch(e){}document.getElementById('status').textContent='Kamera ditutup.';}
start();
</script></body></html>
