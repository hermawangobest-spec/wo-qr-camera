
<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wedding Organizer QR Scanner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
body{font:16px Arial,sans-serif;max-width:760px;margin:20px auto;padding:0 14px;color:#172033}
button{padding:10px 16px;border:0;border-radius:8px;background:#6d28d9;color:white;cursor:pointer}
#reader{width:100%;max-width:520px;margin-top:16px}
#status{padding:12px;background:#f3f4f6;border-radius:8px;overflow-wrap:anywhere}
</style>
</head>
<body>
<h2>Scan QR Tamu</h2>
<p>Izinkan akses kamera. Setelah QR terbaca, hasil akan dikirim ke aplikasi Wedding Organizer.</p>
<button onclick="start()">Mulai Kamera</button>
<button onclick="stop()">Tutup Kamera</button>
<div id="reader"></div>
<p id="status">Siap. Klik Mulai Kamera.</p>
<script>
let scanner=null,done=false;

function send(text){
  if(done)return;
  if(!window.opener || window.opener.closed){
    document.getElementById('status').textContent=
      'Aplikasi Wedding Organizer tidak ditemukan. Buka scanner melalui tombol dari aplikasi.';
    return;
  }
  done=true;
  document.getElementById('status').textContent=
    'QR terbaca. Mengirim hasil ke Wedding Organizer...';
  window.opener.postMessage({
    type:'WO_QR_SCAN',
    text:String(text)
  },'*');
  stop();
}

async function start(){
  try{
    if(!window.isSecureContext)throw Error('Halaman harus dibuka melalui HTTPS.');
    if(!navigator.mediaDevices?.getUserMedia)throw Error('Akses kamera tidak tersedia.');
    if(!window.Html5Qrcode)throw Error('Library scanner belum termuat. Refresh halaman.');
    done=false;
    scanner=new Html5Qrcode('reader');
    await scanner.start(
      {facingMode:'environment'},
      {fps:10,qrbox:{width:240,height:240}},
      text=>send(text),
      ()=>{}
    );
    document.getElementById('status').textContent='Kamera aktif. Arahkan ke QR tamu.';
  }catch(e){
    document.getElementById('status').textContent='Gagal membuka kamera: '+(e.message||e);
  }
}

async function stop(){
  if(scanner){
    try{if(scanner.isScanning)await scanner.stop();}catch(e){}
    try{await scanner.clear();}catch(e){}
    scanner=null;
  }
}
</script>
</body>
</html>
